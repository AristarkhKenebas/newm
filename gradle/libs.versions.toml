[versions]
# The JDK that compiles and runs newm.
java = "27"
# Bytecode version of the compiled classes (Kotlin 2.4 produces at most 26).
java-bytecode = "26"
kotlin = "2.4.21"
caulis = "0.1.6"
junit = "6.1.3"

[libraries]
caulis-wm = { module = "io.github.aristarkhkenebas:caulis-wm", version.ref = "caulis" }
caulis-compose = { module = "io.github.aristarkhkenebas:caulis-compose", version.ref = "caulis" }
caulis-screenshot = { module = "io.github.aristarkhkenebas:caulis-screenshot", version.ref = "caulis" }
kotlin-scripting-jvm-host = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm-host", version.ref = "kotlin" }
kotlin-scripting-jvm = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm", version.ref = "kotlin" }
kotlin-scripting-common = { module = "org.jetbrains.kotlin:kotlin-scripting-common", version.ref = "kotlin" }
luaj = { module = "org.luaj:luaj-jse", version = "3.0.1" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
